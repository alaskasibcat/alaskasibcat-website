<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Отзывы — управление ALASKASIBCAT</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/reviews-admin.css"></head>
<body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="/"><span class="brand-name">Siberian Cat Alaska Cattery</span><span class="brand-sub">ALASKASIBCAT</span></a><a href="/cdn-cgi/access/logout">Выйти</a></div></header>
<main class="wrap admin-main"><h1>Отзывы покупателей</h1><p>Отзывы с сайта и новые черновики ожидают вашей проверки. На сайте видны только опубликованные.</p><p id="admin-status" role="status" aria-live="polite">Проверяем подключение…</p>
<div class="admin-layout"><section><h2>Все отзывы</h2><label for="review-filter">Показать</label><select id="review-filter"><option value="active">Все, кроме удалённых</option><option value="draft">На проверке</option><option value="published">Опубликованные</option><option value="hidden">Скрытые</option><option value="deleted">Удалённые</option></select><div id="reviews-list"></div></section>
<section><h2 id="editor-title">Новый отзыв</h2><form id="review-editor"><fieldset id="editor-fields" disabled><label for="review-author">Имя покупателя для сайта</label><input id="review-author" name="author" maxlength="100" required><label for="review-kitten">Имя котёнка (необязательно)</label><input id="review-kitten" name="kitten" maxlength="100"><label for="review-date">Дата отзыва</label><input id="review-date" name="review_date" type="date" required><label for="review-body">Текст отзыва</label><textarea id="review-body" name="body" rows="7" minlength="5" maxlength="3000" required></textarea><p id="editor-state"></p><div class="actions"><button class="btn btn-primary" type="submit">Сохранить черновик</button><button class="btn btn-quiet" id="new-review" type="button">Новый отзыв</button></div></fieldset></form></section></div></main><script type="module" src="/js/reviews-admin.js"></script></body></html>
