<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reviews admin | ALASKASIBCAT</title><link rel="stylesheet" href="/css/styles.css?v=20261025c"><link rel="stylesheet" href="/css/reviews-admin.css"></head>
<body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="/"><span class="brand-name">Siberian Cat Alaska Cattery</span><span class="brand-sub">ALASKASIBCAT</span></a><a href="/cdn-cgi/access/logout">Sign out</a></div></header>
<main class="wrap admin-main"><h1>Family reviews</h1><p>Review submissions and new drafts await your approval. Only published reviews appear on the website.</p><p id="admin-status" role="status" aria-live="polite">Checking connection…</p>
<div class="admin-layout"><section><h2>All reviews</h2><label for="review-filter">Show</label><select id="review-filter"><option value="active">All except deleted</option><option value="draft">Pending review</option><option value="published">Published</option><option value="hidden">Hidden</option><option value="deleted">Deleted</option></select><div id="reviews-list"></div></section>
<section><h2 id="editor-title">New review</h2><form id="review-editor"><fieldset id="editor-fields" disabled><label for="review-author">Public display name</label><input id="review-author" name="author" maxlength="100" required><label for="review-kitten">Kitten name (optional)</label><input id="review-kitten" name="kitten" maxlength="100"><label for="review-date">Review date</label><input id="review-date" name="review_date" type="date" required><label for="review-body">Review text</label><textarea id="review-body" name="body" rows="7" minlength="5" maxlength="3000" required></textarea><p id="editor-state"></p><div class="actions"><button class="btn btn-primary" type="submit">Save draft</button><button class="btn btn-quiet" id="new-review" type="button">New review</button></div></fieldset></form></section></div></main><script type="module" src="/js/reviews-admin.js?v=20261025c"></script></body></html>
